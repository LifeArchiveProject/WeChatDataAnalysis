<!-- 主题（浅 / 深）：放在样式表之前，首帧前就定好 <html data-theme>——先看记住的选择（localStorage wda.theme：light | dark），没有就跟随系统；
     同步改上面两个 meta（地址栏颜色、默认画布与滚动条），深色访客不先闪一下白。点击切换、跟随系统变化见 main.js 第 6b 节；读不到存储就跟随系统 -->
<script>(function () { var t = null, r = document.documentElement, m; try { t = localStorage.getItem("wda.theme"); } catch (e) { t = null; } if (t !== "light" && t !== "dark") { try { t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { t = "light"; } } r.setAttribute("data-theme", t); m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", t === "dark" ? "#0c0e18" : "#f4f4f7"); m = document.querySelector('meta[name="color-scheme"]'); if (m) m.setAttribute("content", t); })();</script>

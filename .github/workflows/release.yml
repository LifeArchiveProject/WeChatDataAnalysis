name: Publish prebuilt desktop packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 高级版安装包的实际四段版本号
        required: true
        type: string
      platform:
        description: 安装包平台
        required: true
        type: choice
        options: [windows, macos]
      source_run_id:
        description: 高级版构建的 Actions run ID
        required: true
        type: string
      artifact_name:
        description: 该构建已上传的安装包 artifact 名称
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download existing Advanced package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: ${{ vars.WDA_ADVANCED_REPOSITORY || 'woijfwefw/WCDB-Advanced' }}
          run-id: ${{ inputs.source_run_id }}
          name: ${{ inputs.artifact_name }}
          github-token: ${{ secrets.WCE_NATIVE_CORE_PRODUCER_TOKEN }}
          path: release-assets

      - name: Publish package with API release notes
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_URL: ${{ secrets.CHANGELOG_URL }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
        run: >-
          python3 tools/publish-desktop-release.py
          --version "$RELEASE_VERSION"
          --platform "$RELEASE_PLATFORM"
          --assets release-assets
          --publish

name: Qwen GPU Runtime Checks

on:
  pull_request:
    paths:
      - '.github/workflows/qwen-gpu-runtime.yml'
      - 'src/wechat_decrypt_tool/qwen_gpu_runtime.py'
      - 'src/wechat_decrypt_tool/asr_*.py'
      - 'src/wechat_decrypt_tool/voice_transcription.py'
      - 'src/wechat_decrypt_tool/routers/chat_media.py'
      - 'src/wechat_decrypt_tool/resources/qwen_gpu_runtime.json'
      - 'tests/test_qwen_gpu_runtime.py'
      - 'tests/test_asr_upgrade.py'
      - 'tests/test_voice_transcription.py'
      - 'frontend/components/SettingsDialog.vue'
      - 'frontend/composables/useApi.js'
      - 'frontend/tests/voice-model-settings.test.mjs'
      - 'desktop/scripts/build-backend.cjs'
      - 'tools/*qwen*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: python -m pip install uv
      # 公共 runner 不依赖显卡或 3 GB 的组件下载，验证续传、隔离、取消和发布清单。
      - run: uv sync --locked --extra voice-transcription
      - run: >-
          uv run --no-sync pytest -q
          tests/test_qwen_gpu_runtime.py
          tests/test_asr_upgrade.py
          tests/test_voice_transcription.py
      - name: External runtime standard library discovery
        run: uv run --no-sync python tools/qwen_runtime_stdlib.py
      - name: Voice settings contracts
        run: node --test frontend/tests/voice-model-settings.test.mjs
